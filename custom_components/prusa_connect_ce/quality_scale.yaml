rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions yet.
  appropriate-polling:
    status: done
    comment: Push over the event stream; a five-minute refresh is only a safety net.
  brands:
    status: done
    comment: >-
      Shipped in brand/ (Home Assistant 2026.3 and newer). A core submission moves them to
      home-assistant/brands, under a prusa brand grouping prusalink and this domain.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: The client library must be published to PyPI from a public repository with CI.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: An entry is unique by the server's instance_id from /api/v1/health.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner:
    status: todo
    comment: codeowners is empty until an owner is named.
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: todo
    comment: Entries are keyed by instance_id, but a rediscovered server does not update the stored address yet.
  discovery: done
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Nothing needs a repair yet; module approval in phase 2 will raise one.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
