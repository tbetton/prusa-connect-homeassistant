[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prusa-connect"
version = "0.1.0"
description = "Async client for the Prusa Connect HTTP API and event stream"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prusa Research a.s." }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/tbetton/prusa-connect-homeassistant/tree/main/lib"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0", "pytest-cov>=5", "trustme>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/prusa_connect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# A Home Assistant test plugin installed in the same environment stays out.
addopts = "-p no:homeassistant"
